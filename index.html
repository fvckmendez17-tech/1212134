<!DOCTYPE html>

<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#3a1450;--rosa:#ff4f9a;--crema:#fff1f7;--tinta:#4a1740}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Nunito,system-ui,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:10px;left:0;right:0;text-align:center;color:#ffd3e8;font:1.5rem Pacifico,cursive;text-shadow:0 0 14px #ff4f9a;pointer-events:none}
#hud small{display:block;font:800 .85rem Nunito,sans-serif;text-shadow:none;margin-top:2px}
#joy{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));width:150px;height:150px;touch-action:none}
.h{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:128px;line-height:1;pointer-events:none}
#hb{filter:grayscale(1) brightness(.8);opacity:.5}
#hc{clip-path:inset(100% 0 0 0);transition:clip-path 1s ease;filter:drop-shadow(0 0 10px #ff4f9a)}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 3px var(--rosa),0 3px 10px rgba(0,0,0,.4)}
#letter{position:fixed;right:16px;bottom:max(24px,env(safe-area-inset-bottom));width:70px;height:70px;border-radius:50%;font-size:34px;padding:0;display:none;animation:beat 1.2s infinite}
#letter.on{display:block}
@keyframes beat{50%{transform:scale(1.12)}}
#dbubble{position:fixed;left:0;top:0;display:none;align-items:center;gap:10px;background:#fff;color:var(--tinta);border-radius:20px;padding:8px 14px 8px 8px;max-width:300px;font-weight:800;font-size:.95rem;line-height:1.25;box-shadow:0 5px 0 #c64a86;pointer-events:none;z-index:5}
#dbubble.on{display:flex;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
#dbubble img{width:52px;height:52px;border-radius:50%;flex:none}
#dbubble:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
#toast{position:fixed;top:76px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:.35s;background:var(--crema);color:var(--tinta);border-radius:18px;padding:12px 16px;max-width:340px;width:calc(100% - 32px);text-align:center;font-weight:800;box-shadow:0 5px 0 #c64a86;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast img{display:block;width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,6,45,.7);padding:16px;z-index:20}
#modal.on{display:flex}
#card{background:var(--crema);color:var(--tinta);max-width:380px;width:100%;border-radius:22px;padding:22px;text-align:center;box-shadow:0 8px 0 #c64a86;animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-height:90vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#card h2{font:1.7rem Pacifico,cursive;margin:0 0 4px;color:#c2307a}
#card .mes{font-weight:800;font-size:.9rem;opacity:.7}
#card img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin:8px 0;transition:transform 0.4s ease}
#card img.zoom1{transform:scale(1.12)}
#card img.zoom2{transform:scale(1.25);animation:pulseImg 1.2s infinite ease-in-out}
@keyframes pulseImg{0%,100%{transform:scale(1.25)}50%{transform:scale(1.35)}}
#card p{margin:10px 0 16px;line-height:1.45;font-weight:600}
button{font:800 1rem Nunito,sans-serif;color:#fff;background:var(--rosa);border:0;border-radius:99px;padding:12px 26px;box-shadow:0 4px 0 #b52a69;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b52a69}
@media (prefers-reduced-motion:reduce){#card,#letter{animation:none}}
</style>
</head>

let vw,vh,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr}
addEventListener('resize',resize,{passive:true});resize();

const me={x:START.x,y:START.y,t:0};
const visited=new Set();let paused=false,final=false;
const path=[START,...STOPS];

let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const deco=[];
for(let i=0;i<260;i++)deco.push({x:rnd()*W,y:rnd()*H,k:rnd()<.7?'f':'t',c:['#ffd3e8','#fff','#ffe08a','#ff9ccd'][i%4],r:3+rnd()*4});

const perimeterGardens=[];
for(let x=40; x<W-40; x+=90){

for(let y=120; y<H-120; y+=110){
  perimeterGardens.push({x:45, y, t:'flower'});

}

function dToPath(px,py){let m=1e9;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];const dx=b.x-a.x,dy=b.y-a.y;let t=((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));m=Math.min(m,Math.hypot(px-a.x-t*dx,py-a.y-t*dy))}return m}
const decoOk=deco.filter(d=>dToPath(d.x,d.y)>70&&STOPS.every(p=>Math.hypot(d.x-p.x,d.y-p.y)>200));

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Enter'&&paused)closeModal()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joy=document.getElementById('joy'),knob=document.getElementById('knob'),hc=document.getElementById('hc');
let jv={x:0,y:0},jid=null;
function jmove(e){const r=joy.getBoundingClientRect(),cx=r.left+75,cy=r.top+75;
  let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=48;
  if(d>m){dx*=m/d;dy*=m/d}
  knob.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/m,y:dy/m}}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)},{passive:true});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)},{passive:true});
const jend=e=>{if(e.pointerId===jid){jid=null;jv={x:0,y:0};knob.style.transform=''}};
joy.addEventListener('pointerup',jend,{passive:true});joy.addEventListener('pointercancel',jend,{passive:true});

function fuzz(cx,cy,r,n,seed){const fur='#e9c585',lt='#f8e3b3';ctx.fillStyle=fur;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle=lt;ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<n;i++){const a=i*2.4+seed,d=r*(.3+((i*37)%10)/14);ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d);ctx.lineTo(cx+Math.cos(a+.4)*(d+7),cy+Math.sin(a+.4)*(d+7));ctx.stroke()}}

function bear(x,y,t,mv){
  const ph=t*11,s=mv?Math.sin(ph):0,c=mv?Math.cos(ph):0;
  const bob=mv?-Math.abs(s)*6:Math.sin(t*2)*1.5;
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,42,30+bob*.5,9,0,0,7);ctx.fill();
  ctx.translate(0,40);ctx.rotate(s*.07+(me.vx||0)*.1);ctx.scale(1+Math.abs(c)*.025,1-Math.abs(c)*.03);ctx.translate(0,-40+bob);
  const lg=(sx,k)=>{const lift=mv?Math.max(0,k*s)*10:0;fuzz(sx+(mv?k*s*-6:0),31-lift,11,6,sx);ctx.fillStyle='#fbe9bf';ctx.beginPath();ctx.arc(sx+(mv?-k*s*6:0),33-lift,5,0,7);ctx.fill()};
  lg(-15,1);lg(15,-1);
  fuzz(0,14,24,22,3);
  fuzz(-27,10+s*6,8,5,7);fuzz(27,10-s*6,8,5,8);
  const hb=mv?c*2:0;ctx.translate(0,hb);
  fuzz(-23,-26+c*2,10,6,4);fuzz(23,-26-c*2,10,6,5);fuzz(0,-12,27,28,6);
  ctx.fillStyle='#fff1d0';ctx.beginPath();ctx.ellipse(0,-3,13,10,0,0,7);ctx.fill();
  ctx.fillStyle='#3b2118';ctx.beginPath();ctx.ellipse(0,-8,6,4.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(-10,-18,2.6,0,7);ctx.arc(10,-18,2.6,0,7);ctx.fill();
  ctx.strokeStyle='#3b2118';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,-1);
  ctx.moveTo(-5,0);ctx.quadraticCurveTo(0,4,5,0);ctx.stroke();
  ctx.restore();
}

const tur={x:START.x-70,y:START.y+25,ph:0,face:1,mv:false};
function turtle(){
  const s=tur.mv?Math.sin(tur.ph):0,bob=tur.mv?-Math.abs(s)*2:0,hd=tur.mv?s*1.5:0,SK='#3a4249';
  ctx.save();ctx.translate(tur.x,tur.y);ctx.scale(tur.face,1);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,18,31,6,0,0,7);ctx.fill();
  const leg=(x,k)=>{const l=tur.mv?Math.max(0,k*s)*5:0,lx=x+(tur.mv?k*s*4:0);ctx.fillStyle=SK;ctx.beginPath();ctx.ellipse(lx,13-l,6.5,6,0,0,7);ctx.fill();
    ctx.fillStyle='#22282d';ctx.fillRect(lx+2,16-l,2,3);ctx.fillRect(lx-2,17-l,2,3)};
  leg(-18,1);leg(-5,-1);leg(9,-1);leg(21,1);
  ctx.fillStyle=SK;ctx.beginPath();ctx.moveTo(-26,7);ctx.lineTo(-35,11);ctx.lineTo(-25,12);ctx.fill();
  ctx.translate(0,bob);
  ctx.fillStyle=SK;ctx.fillRect(18,-8,14,10);
  ctx.fillStyle='#26232b';ctx.beginPath();ctx.ellipse(35+hd,-3,11.5,8.5,0,0,7);ctx.fill();
  ctx.fillStyle='#f2d63a';
  [[31,-4.5,3.6,1.9,.7],[35,-9.5,3.4,1.6,.2],[41.5,-.5,2.8,1.6,-.3],[28,-1,2,1.3,.5]].forEach(m=>{ctx.beginPath();ctx.ellipse(m[0]+hd,m[1],m[2],m[3],m[4],0,7);ctx.fill()});
  ctx.fillStyle='#c9dc6a';ctx.beginPath();ctx.arc(38+hd,-5,2.4,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(38.5+hd,-5,1.2,0,7);ctx.fill();
  ctx.fillStyle='#cfc99c';ctx.beginPath();ctx.ellipse(0,11,27,6,0,0,7);ctx.fill();

function updDoki(dt){
  const dx=me.x-dk.x,dy=me.y-dk.y,d=Math.hypot(dx,dy)||1;
  if(dk.state==='run'){
    let vx,vy,sp;
    if(d<320){vx=-dx/d;vy=-dy/d;sp=215}
    else{if(dk.wait<=0||Math.hypot(dk.tx-dk.x,dk.ty-dk.y)<40){dk.tx=120+Math.random()*(W-240);dk.ty=140+Math.random()*(H-240);dk.wait=5}
      dk.wait-=dt;const l=Math.hypot(dk.tx-dk.x,dk.ty-dk.y)||1;vx=(dk.tx-dk.x)/l;vy=(dk.ty-dk.y)/l;sp=140}
    if((dk.x<80&&vx<0)||(dk.x>W-80&&vx>0)){vx=0;vy=dy>0?-1:1}
    if((dk.y<110&&vy<0)||(dk.y>H-70&&vy>0)){vy=0;vx=dx>0?-1:1}
    dk.x+=vx*sp*dt;dk.y+=vy*sp*dt;dk.mv=true;if(Math.abs(vx)>.15)dk.face=vx>0?1:-1;
    if(d<50)catchDoki();
  }else{
    const tx=me.x+(me.x>W-120?-72:72),ty=me.y+14,ex=tx-dk.x,ey=ty-dk.y,e=Math.hypot(ex,ey)||1;
    dk.mv=e>18;if(dk.mv){const v=Math.min(290,e*5+40);dk.x+=ex/e*v*dt;dk.y+=ey/e*v*dt;if(Math.abs(ex)>5)dk.face=ex>0?1:-1}
  }

}

    ctx.font='800 13px Nunito,sans-serif';ctx.fillStyle='#fff';ctx.fillText('Parquecito 💞',x,y-72);break;
  case 'flower':ctx.font='24px serif';['🌸','🌼','🌷'].forEach((f,i)=>ctx.fillText(f,x-26+i*26,y+(i%2)*10));break;
  }ctx.restore()}

function collide(p){
  for(let i=0;i<SCENE.length;i++){
    const o = SCENE[i];
    const r=o.r??SOLID[o.t];if(!r)continue;
    const dx=p.x-o.x,dy=p.y+32-o.y,d=Math.hypot(dx,dy),m=r+18;
    if(d<m&&d>0){p.x+=dx/d*(m-d);p.y+=dy/d*(m-d)}
  }
}

function drawGrid(){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='left';
  for(let x=0;x<=W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();if(x%200==0)ctx.fillText(x,x+3,12+camy)}
  for(let y=0;y<=H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();if(y%200==0)ctx.fillText(y,3+camx,y-3)}}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='g')debug=!debug});

let lastH=-1,px0=me.x;
function tick(dt){
  if(paused)return;
  if(final)letterBtn.classList.add('on');
  me.vx=Math.max(-1,Math.min(1,(me.x-px0)/(dt*260)));px0=me.x;
  updDoki(dt);const dx=me.x-tur.x,dy=me.y-tur.y,d=Math.hypot(dx,dy);
  tur.mv=d>80;if(tur.mv){const v=Math.min(250,(d-80)*4+50);tur.x+=dx/d*v*dt;tur.y+=dy/d*v*dt;tur.ph+=dt*9;if(Math.abs(dx)>6)tur.face=dx>0?1:-1}

  for(let j=0; j<EGGS.length; j++){
    const e = EGGS[j];
    const d=Math.hypot(me.x-e[0],me.y-e[1]);
    const triggerRadius = (e[3]==="BRITANICO_ANIMATED" || e[3]==="CAFE_ANIMATED" || e[3]==="BUS_S_ANIMATED" || e[3]==="KISS_BENCH_ANIMATED" || e[3]==="PET_HOUSE_ANIMATED") ? 85 : 38;
    if(d < triggerRadius && !nearE.has(j)){
      nearE.add(j);
      found.add(j);
      showEgg(e);
    } else if(d > triggerRadius + 50){
      nearE.delete(j);
    }
  }

  for(let i=0; i<STOPS.length; i++){
    const p = STOPS[i];
    const d=Math.hypot(me.x-p.x,me.y-p.y);
    if(d<60 && !nearS.has(i)){
      nearS.add(i);
      visited.add(i);
      revealT[i]=me.t;
      openModal(i);
    } else if(d>110){
      nearS.delete(i);
    }
  }

  if(visited.size!==lastH){lastH=visited.size;hc.style.clipPath=`inset(${100-lastH/STOPS.length*100}% 0 0 0)`}
}

function fz(c,cx,cy,r,col,hi,n,sd){c.fillStyle=col;c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle=hi;c.lineWidth=Math.max(1,r/14);c.lineCap='round';
  for(let i=0;i<n;i++){const a=i*2.4+sd,d=r*(.3+((i*37)%10)/14);c.beginPath();c.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d);c.lineTo(cx+Math.cos(a+.4)*(d+r*.25),cy+Math.sin(a+.4)*(d+r*.25));c.stroke()}}

  el(-.95,.05,.38,.7,'#26232b',.15);el(.95,.05,.38,.7,'#26232b',-.15);

  c.strokeStyle='#26232b';c.lineWidth=s*.07;c.lineCap='round';
  [-.4,.45].forEach(e=>{
    if(z==='wink'&&e>0){c.beginPath();c.arc(x+e*s,y+.02*s,.15*s,Math.PI+.2,-.2);c.stroke()}
    else if(z===true){c.beginPath();c.arc(x+e*s,y-.05*s,.13*s,.1,Math.PI-.1);c.stroke()}
    else{el(e,-.06,.15,.15,'#fff');el(e+.02,-.05,.1,.1,'#26232b');el(e+.05,-.09,.035,.035,'#fff')}});
  el(0,.3,.24,.17,'#15131a');el(-.07,.26,.06,.035,'#fff');
  if(z==='wink'){el(-.72,.3,.15,.09,'rgba(255,110,150,.5)');el(.72,.3,.15,.09,'rgba(255,110,150,.5)');
    c.fillStyle='#b8405e';c.beginPath();c.moveTo(x-.22*s,y+.5*s);c.quadraticCurveTo(x,y+.9*s,x+.22*s,y+.5*s);c.closePath();c.fill();el(0,.7,.1,.07,'#ff8fb0')}
  else{c.lineWidth=s*.05;c.beginPath();c.moveTo(x-.16*s,y+.5*s);c.quadraticCurveTo(x,y+.64*s,x+.16*s,y+.5*s);c.stroke()}}

    c.lineCap='round';
    c.strokeStyle='#c98a5e';c.lineWidth=30;c.beginPath();c.moveTo(46,192);c.lineTo(104,173);c.stroke();

    mit(122,171,-.2,'#d49a6c');mit(158,171,.2,'#efc19a');

      c.strokeStyle='#efc19a';c.lineWidth=7.5;c.beginPath();c.moveTo(152,163+i*7);c.lineTo(125+i*2,168+i*7);c.stroke()}}

    c.fillStyle='#8bbf6a';c.fillRect(0,150,280,60);c.fillStyle='#d9d4c6';c.fillRect(0,172,280,38);

    fz(c,52,194,13,'#e9c585','#f8e3b3',8,1);fz(c,52,174,11,'#e9c585','#f8e3b3',8,2);fz(c,44,165,4.5,'#e9c585','#f8e3b3',3,3);fz(c,60,165,4.5,'#e9c585','#f8e3b3',3,4);
    c.fillStyle='#fff1d0';c.beginPath();c.ellipse(52,178,5,4,0,0,7);c.fill();c.fillStyle='#3b2118';c.beginPath();c.ellipse(52,176,2.2,1.6,0,0,7);c.arc(48,171,1.2,0,7);c.arc(56,171,1.2,0,7);c.fill();
    c.font='20px serif';c.fillText('💗',74,160);c.fillText('✨',250,50);c.fillText('💗',24,100)}
  else{if(k==='sleep'){c.fillStyle='#fbfaf8';c.beginPath();c.ellipse(140,200,115,62,0,0,7);c.fill();c.fillStyle='#26232b';c.beginPath();c.ellipse(215,180,42,30,0,0,7);c.fill();
      c.fillStyle='#cfc6ff';c.font='800 30px Nunito,sans-serif';c.fillText('z',226,60);c.font='800 20px Nunito,sans-serif';c.fillText('z',250,36)}
    dokiFace(c,k==='sleep'?125:140,100,70,k==='sleep')}
  return pics[k]=cn.toDataURL()}
const pic=u=>u&&u.startsWith('doki:')?dokiPic(u.slice(5)):u;
const letterBtn=document.getElementById('letter');
letterBtn.onclick=()=>{paused=true;card.innerHTML=`<h2>Para ti 💌</h2><p style="white-space:pre-line">${FINAL_MSG}</p><button id="ok">💖</button>`;modal.classList.add('on');document.getElementById('ok').onclick=closeModal};

const revealT={},gr=h=>{const n=parseInt(h.slice(1),16),l=Math.round((((n>>16)&255)*.3+((n>>8)&255)*.59+(n&255)*.11)*.75+25);return `rgb(${l},${l},${l})`};
function park(p,i,t,done){
  const {x,y}=p;
  if(x<camx-150||x>camx+vw+150||y<camy-150||y>camy+vh+150)return;
  ctx.save();ctx.textAlign='center';
  if(!done){ctx.fillStyle=gr('#3b7a4a');ctx.beginPath();ctx.roundRect(x-110,y-80,220,160,24);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.stroke();ctx.setLineDash([]);
    ctx.font=`${50+Math.sin(t*3+i)*3}px serif`;ctx.fillText('🔒',x,y+16);ctx.restore();return}
  const age=t-(revealT[i]??-9),sc=age<.7?1+Math.sin(age/.7*Math.PI)*.2:1;
  ctx.translate(x,y);ctx.scale(sc,sc);ctx.translate(-x,-y);
  if(p.kind==='shop'){ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(x-95,y-62,190,128,14);ctx.fill();
    for(let k=0;k<6;k++){ctx.fillStyle=k%2?'#fff':'#ffd3e8';ctx.fillRect(x-95+k*31.6,y-62,31.6,26)}
    ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(x-72,y-22,54,44);ctx.fillStyle='#6b4226';ctx.fillRect(x+25,y-22,46,88);
    ctx.font='36px serif';ctx.fillText(p.emoji,x-45,y+12)}
  else if(p.kind==='plaza'){ctx.fillStyle='#c9b99a';ctx.beginPath();ctx.arc(x,y,86,0,7);ctx.fill();ctx.fillStyle='#e8dcc0';ctx.beginPath();ctx.arc(x,y,64,0,7);ctx.fill();
    ctx.font=`${58+Math.sin(t*3)*3}px serif`;ctx.fillText(p.emoji,x,y+20)}
  else{ctx.fillStyle='#4d9a55';ctx.beginPath();ctx.roundRect(x-110,y-80,220,160,24);ctx.fill();
    ctx.strokeStyle='#0d0d12';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-110,y+80);ctx.lineTo(x-110,y-80);ctx.moveTo(x-110,y+80);ctx.lineTo(x+110,y+80);ctx.stroke();
    for(let k=0;k<=10;k++){const a=-110+k*22;ctx.beginPath();ctx.moveTo(x+a,y+80);ctx.lineTo(x+a,y+62);ctx.stroke()}
    for(let k=0;k<=7;k++){const a=-80+k*23;ctx.beginPath();ctx.moveTo(x-110,y+a);ctx.lineTo(x-92,y+a);ctx.stroke()}
    ctx.font='34px serif';ctx.fillText('🌴',x+60,y-30);ctx.fillText('🌴',x+80,y+20);
    ctx.font=`${46+Math.sin(t*3)*3}px serif`;ctx.fillText(p.emoji,x,y+8);
    if(i===0){ctx.font='26px serif';ctx.fillText('💗',x-85,y+50+Math.sin(t*4)*4)}}
  ctx.font='800 15px Nunito,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText('Mes '+(i+1),x,y-94);ctx.fillStyle='#fff';ctx.fillText('Mes '+(i+1),x,y-94);
  ctx.restore()}

const dynamicRenderables = [
  {y: 0, f: () => bear(me.x, me.y, me.t, me.mv)},
  {y: 0, f: turtle},
  {y: 0, f: drawDoki}
];

function draw(){
  camx=Math.max(0,Math.min(W-vw,me.x-vw/2));camy=Math.max(0,Math.min(H-vh,me.y-vh/2));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#2f6b45';ctx.fillRect(0,0,vw,vh);
  ctx.translate(-camx,-camy);
  
  const minX = camx - 150, maxX = camx + vw + 150;
  const minY = camy - 150, maxY = camy + vh + 150;

  for(let i=0; i<decoOk.length; i++){
    const d = decoOk[i];
    if(d.x<minX||d.x>maxX||d.y<minY||d.y>maxY)continue;
    ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.k==='f'?d.r:0,0,7);ctx.fill();
    if(d.k==='t'){ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('🌳',d.x,d.y)}
  }

  for(let i=0; i<perimeterGardens.length; i++){
    const g = perimeterGardens[i];
    if(g.x<minX||g.x>maxX||g.y<minY||g.y>maxY)continue;
    ctx.font = g.t === 'tree' ? '30px serif' : '20px serif';
    ctx.textAlign='center';
    ctx.fillText(g.t === 'tree' ? '🌲' : '🌸', g.x, g.y);
  }

  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#d8b98a';ctx.lineWidth=64;ctx.beginPath();
  for(let i=0; i<path.length; i++) i ? ctx.lineTo(path[i].x, path[i].y) : ctx.moveTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.strokeStyle='#f1dcb6';ctx.lineWidth=52;ctx.setLineDash([2,34]);ctx.stroke();ctx.setLineDash([]);
  
  for(let i=0; i<STOPS.length; i++) park(STOPS[i], i, me.t, visited.has(i));
  if(debug)drawGrid();
  
  for(let i=0; i<SCENE.length; i++){
    const o = SCENE[i];
    if(GROUND.has(o.t) && o.x>minX && o.x<maxX && o.y>minY && o.y<maxY) drawProp(o);
  }
  
  drawEggs();
  
  dynamicRenderables[0].y = me.y;
  dynamicRenderables[1].y = tur.y;
  dynamicRenderables[2].y = dk.y;
  
  const sortList = dynamicRenderables.slice();
  for(let i=0; i<SCENE.length; i++){
    const o = SCENE[i];
    if(!GROUND.has(o.t) && o.x>minX && o.x<maxX && o.y>minY && o.y<maxY){
      sortList.push({y: o.y, f: () => drawProp(o)});
    }
  }
  
  sortList.sort((a,b)=>a.y-b.y);
  for(let i=0; i<sortList.length; i++) sortList[i].f();
  
  ctx.setTransform(1,0,0,1,0,0);if(dbOn)posBubble();
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;me.t+=dt;
  if(!paused){
    let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jv.x;
    let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jv.y;
    const m=Math.hypot(dx,dy);me.mv=m>.1;
    if(m>1){dx/=m;dy/=m}
    if(me.mv){me.x=Math.max(30,Math.min(W-30,me.x+dx*260*dt));me.y=Math.max(40,Math.min(H-30,me.y+dy*260*dt));collide(me)}
  }
  document.getElementById('prog').textContent=final?'¡Completaste el camino! 💖':`Recuerdos ${visited.size}/${STOPS.length} · Sorpresas ${found.size}/${totalEggs}`;
  tick(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
